name: 构建 Docker 镜像

on:
  workflow_dispatch:
    inputs:
      push_to_registry:
        description: '推送到 Docker Hub'
        required: true
        default: true
        type: boolean
  push:
    branches:
      - main
    paths:
      - 'config/version.json'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: docker.io
  IMAGE_NAME: dinlinguangguang/mediahub

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 获取版本号
        id: version
        run: |
          VERSION=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('config/version.json', 'utf8')).version)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 设置 QEMU（支持多架构构建）
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        if: ${{ github.event.inputs.push_to_registry == 'true' || github.event_name == 'push' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event.inputs.push_to_registry == 'true' || github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
