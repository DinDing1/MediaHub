name: 构建 MediaHub

on:
  workflow_dispatch:
    inputs:
      platform:
        description: '构建平台'
        required: true
        default: 'x86_64'
        type: choice
        options:
          - all
          - x86_64
          - aarch64
  push:
    branches:
      - main
    paths:
      - 'config/version.json'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  FNOS_PKG_DIR: deploy/fnos/mediahub
  FNOS_PKG_PARENT: deploy/fnos
  FNPACK_BASE_URL: https://static2.fnnas.com/fnpack
  NODE_RUNTIME_VERSION: '24.15.0'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      version: ${{ steps.check.outputs.version }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 读取版本并判断是否构建
        id: check
        run: |
          set -euo pipefail
          VERSION=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('config/version.json','utf8')).version)")
          PKG_VERSION=$(node -e "process.stdout.write(require('./package.json').version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "应用版本: $VERSION"

          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "版本不一致: config/version.json=$VERSION package.json=$PKG_VERSION"
            exit 1
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "手动触发，执行构建"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PREVIOUS_VERSION=$(git show HEAD~1:config/version.json 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{try{process.stdout.write(JSON.parse(s).version||'')}catch{process.stdout.write('')}})" || true)
          if [ "$VERSION" != "$PREVIOUS_VERSION" ]; then
            echo "版本号已更新 ($PREVIOUS_VERSION -> $VERSION)，执行构建"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "版本号未更新，跳过构建"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 设置构建矩阵
        id: matrix
        if: steps.check.outputs.should_build == 'true'
        run: |
          set -euo pipefail
          PLATFORM="${{ github.event.inputs.platform }}"
          # push 触发时 inputs 为空，默认双架构
          if [ -z "$PLATFORM" ] || [ "$PLATFORM" = "all" ]; then
            echo 'matrix={"include":[{"arch":"x86_64","runner":"ubuntu-latest","fnpack":"fnpack-1.2.1-linux-amd64","platform":"x86","nodeArch":"x64"},{"arch":"aarch64","runner":"ubuntu-24.04-arm","fnpack":"fnpack-1.2.1-linux-arm64","platform":"arm","nodeArch":"arm64"}]}' >> "$GITHUB_OUTPUT"
          elif [ "$PLATFORM" = "x86_64" ]; then
            echo 'matrix={"include":[{"arch":"x86_64","runner":"ubuntu-latest","fnpack":"fnpack-1.2.1-linux-amd64","platform":"x86","nodeArch":"x64"}]}' >> "$GITHUB_OUTPUT"
          elif [ "$PLATFORM" = "aarch64" ]; then
            echo 'matrix={"include":[{"arch":"aarch64","runner":"ubuntu-24.04-arm","fnpack":"fnpack-1.2.1-linux-arm64","platform":"arm","nodeArch":"arm64"}]}' >> "$GITHUB_OUTPUT"
          else
            echo "未知平台: $PLATFORM"
            exit 1
          fi

  package:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 校验关键路径
        run: |
          set -euo pipefail
          test -f nuxt.config.ts
          test -f package.json
          test -f config/version.json
          test -d app && test -d server && test -d public && test -d fonts
          test -f "${{ env.FNOS_PKG_DIR }}/manifest"
          test -f "${{ env.FNOS_PKG_DIR }}/cmd/main"
          test -d "${{ env.FNOS_PKG_DIR }}/cmd"
          test -d "${{ env.FNOS_PKG_DIR }}/wizard"
          # 仓库内不应提交 Docker / fnpack 二进制
          if [ -f Dockerfile ] || [ -f docker-compose.yml ]; then
            echo "错误：仓库中不应包含 Docker 部署文件"
            exit 1
          fi
          if ls fnpack-* >/dev/null 2>&1; then
            echo "错误：仓库中不应提交 fnpack 二进制，应由 CI 临时下载"
            exit 1
          fi

      - name: 安装 Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 安装依赖
        run: npm ci

      - name: 代码质检
        run: npm run typecheck

      - name: 构建项目
        run: npm run build

      - name: 校验构建产物
        run: |
          set -euo pipefail
          test -f .output/server/index.mjs
          test -d .output/public

      - name: 组装飞牛包内容
        run: |
          set -euo pipefail
          PKG="${{ env.FNOS_PKG_DIR }}"
          VERSION="${{ needs.prepare.outputs.version }}"
          NODE_VERSION="${{ env.NODE_RUNTIME_VERSION }}"
          NODE_ARCH="${{ matrix.nodeArch }}"

          rm -rf "${PKG}/app/www" "${PKG}/app/runtime"
          mkdir -p "${PKG}/app/www/server" "${PKG}/app/www/public" "${PKG}/app/runtime/bin"

          # 内置 Node 运行时（临时下载，不入库）
          NODE_TAR="node-v${NODE_VERSION}-linux-${NODE_ARCH}.tar.xz"
          NODE_URL="https://nodejs.org/dist/v${NODE_VERSION}/${NODE_TAR}"
          TMP_DIR="$(mktemp -d)"
          echo "下载 Node: ${NODE_URL}"
          curl -fsSL -o "${TMP_DIR}/node.tar.xz" "${NODE_URL}"
          tar -xJf "${TMP_DIR}/node.tar.xz" -C "${TMP_DIR}" "node-v${NODE_VERSION}-linux-${NODE_ARCH}/bin/node"
          cp "${TMP_DIR}/node-v${NODE_VERSION}-linux-${NODE_ARCH}/bin/node" "${PKG}/app/runtime/bin/node"
          chmod +x "${PKG}/app/runtime/bin/node"
          rm -rf "${TMP_DIR}"

          # 解引用符号链接，避免飞牛安装「设置目录权限失败」
          rsync -aL --delete .output/server/ "${PKG}/app/www/server/"
          rsync -aL --delete .output/public/ "${PKG}/app/www/public/"
          find "${PKG}/app/www/server" -type d -name '.bin' -prune -exec rm -rf {} + 2>/dev/null || true

          remaining="$(find "${PKG}/app/www/server" -type l | wc -l)"
          echo "server 剩余符号链接: ${remaining}"
          if [ "${remaining}" -gt 0 ]; then
            find "${PKG}/app/www/server" -type l
            exit 1
          fi
          test -f "${PKG}/app/www/server/index.mjs"
          test -x "${PKG}/app/runtime/bin/node"

          # manifest 版本与架构
          sed -i "s/^version=.*/version=${VERSION}/" "${PKG}/manifest"
          if grep -q '^platform=' "${PKG}/manifest"; then
            sed -i "s/^platform=.*/platform=${{ matrix.platform }}/" "${PKG}/manifest"
          elif grep -q '^arch=' "${PKG}/manifest"; then
            sed -i "s/^arch=.*/arch=${{ matrix.arch }}/" "${PKG}/manifest"
          else
            echo "arch=${{ matrix.arch }}" >> "${PKG}/manifest"
          fi

          # 脚本/配置统一 LF，并保证 cmd 可执行
          for f in "${PKG}/cmd/"* "${PKG}/wizard/"* "${PKG}/manifest" "${PKG}/config/"* "${PKG}/app/ui/config"; do
            [ -f "$f" ] && sed -i $'s/\r$//' "$f"
          done
          chmod +x "${PKG}/cmd/"*
          du -sh "${PKG}/app/www/server" "${PKG}/app/www/public" "${PKG}/app/runtime" || true

      - name: 下载 fnpack 并打 fpk
        run: |
          set -euo pipefail
          PKG_PARENT="${{ env.FNOS_PKG_PARENT }}"
          VERSION="${{ needs.prepare.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          FNPACK_URL="${{ env.FNPACK_BASE_URL }}/${{ matrix.fnpack }}"
          TMP_FNPACK="$(mktemp)"

          echo "下载 fnpack: ${FNPACK_URL}"
          curl -fsSL -o "${TMP_FNPACK}" "${FNPACK_URL}"
          chmod +x "${TMP_FNPACK}"

          cd "${PKG_PARENT}"
          "${TMP_FNPACK}" build -d mediahub
          rm -f "${TMP_FNPACK}"

          FPK_FILE="$(find . -maxdepth 3 -type f -name '*.fpk' | head -n 1)"
          if [ -z "$FPK_FILE" ]; then
            echo "未找到 fpk，目录内容："
            find . -maxdepth 3 -print
            exit 1
          fi
          OUT="mediahub-${VERSION}-${ARCH}.fpk"
          mv "$FPK_FILE" "$OUT"
          ls -lh "$OUT"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: mediahub-${{ matrix.arch }}
          path: ${{ env.FNOS_PKG_PARENT }}/mediahub-${{ needs.prepare.outputs.version }}-${{ matrix.arch }}.fpk

  release:
    needs: [prepare, package]
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 清理本仓库旧 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"
          gh release list --limit 100 --repo "${{ github.repository }}" --json tagName --jq '.[].tagName' | while read -r tag; do
            if [[ ( "$tag" == mediahub-* && "$tag" != "mediahub-$VERSION" ) || ( "$tag" == fpk-v* ) ]]; then
              echo "删除旧版本: $tag"
              gh release delete "$tag" --repo "${{ github.repository }}" --yes || true
            fi
          done

      - name: 发布到当前仓库
        uses: softprops/action-gh-release@v1
        with:
          tag_name: mediahub-${{ needs.prepare.outputs.version }}
          name: MediaHub v${{ needs.prepare.outputs.version }}
          files: artifacts/**/*.fpk
          generate_release_notes: false