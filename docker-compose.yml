services:
  mediahub:
    image: dinding1/mediahub:latest
    container_name: mediahub
    ports:
      - "3030:3030"   # Web 管理界面
      - "8097:8097"   # Emby 反代端口（可选，启用反代时需要）
    volumes:
      - ./data:/app/data                    # 应用数据（数据库等）
      - ./logs:/app/logs                    # 日志目录
      - /path/to/your/media:/app/media          # 媒体目录，STRM 文件输出路径
    environment:
      - NODE_ENV=production
      - TZ=Asia/Shanghai
    restart: unless-stopped
